# fb-agent driving Gemma 4 31B QAT served from TAMU HPRC.
#
#   fb-bench run <bugs> --agent fb-agent-hprc-gemma --model gemma4:31b-qat
#
# Identical to fb-agent-hprc.agent.yaml except that hprc_gemma.yaml carries
# Gemma's sampling. Start the server and the tunnel first.
name: fb-agent-hprc-gemma

command: >
  python3 -m fb_agent
  --workspace {workspace}
  --mcp-socket {mcp_socket}
  --task "{opening}"
  --model {model}
  --max-turns {max_turns}
  --timeout {timeout}
  -c fbbench -c hprc_gemma

# Recorded in score.json. The agent does reach one address -- the tunnelled
# model server on localhost -- and nothing else.
network: blocked
