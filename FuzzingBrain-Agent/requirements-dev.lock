# What the test suite needs, on top of requirements.lock.
#
# Kept separate because these are not what a benchmark cell runs on: a cell only
# ever imports the runtime set. Deliberately narrow -- the `dev` extra in
# pyproject.toml also pulls the mkdocs/ruff/pre-commit toolchain, none of which
# is needed to run `pytest tests`, and all of which slows a fresh clone down.
#
# pytest-asyncio is not optional: pyproject sets asyncio_mode = "auto", so
# pytest fails to configure without it.
