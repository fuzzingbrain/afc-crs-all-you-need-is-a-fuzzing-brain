# Tool descriptions — model-facing text, separated from the tool code.
#
# A tool's description is prompt: the model decides how and when to call a tool
# from what this says. Keeping it here rather than inline in tools.py means every
# word the model reads about the tools lives in prompts/, with the rest.
#
# Each entry is one tool. `description` is the tool's own text; `params` gives a
# per-argument line where one helps the model.

read:
  description: >
    Read a file (or a slice), returned with line numbers. Paths are relative to
    the challenge directory.
  params:
    offset: "first line, 1-based"
    limit: "how many lines"

glob:
  description: "List files matching a glob pattern, e.g. '**/*.c' or 'src/*.h'."

grep:
  description: >
    Search file contents for a pattern (ripgrep). Optionally restrict to a glob.

bash:
  description: >
    Run a shell command in the challenge directory. Use it to write a candidate
    input (e.g. with python3) and to test it with ./submit <file>. No network.

gates:
  description: >
    Deterministic constraint precompute. Given a function name, returns the
    literal input gates on the static call-path from the harness entry to it --
    magic byte sequences (memcmp/strncmp against a constant), minimum/maximum
    length checks, and byte-equality tests -- that an input must satisfy to
    reach it. Call this before you build a seed for a target: it tells you the
    concrete bytes and lengths the path requires, so you are not guessing which
    bytes matter. Computed from the source, not a model's opinion.
  params:
    func: "the target function name (one from the worklist above)"

trace:
  description: >
    Dynamic reach + crash report from a real run. Give it an input file you
    wrote and a target function; it runs that input under a debugger and tells
    you whether it reached the target (with the live argument values there),
    and, if it faulted, the signal and the crash backtrace with the runtime
    values at the fault. Unlike reading a crash stack, this works on a CLEAN run
    too -- so use it to check "did my input actually reach this sink?" and, once
    it crashes, to see the concrete pointer/index/size that went wrong and build
    the next variant. Note: leak detection is off under the debugger, so a
    memory-leak fault will not show here -- confirm those through ./submit.
  params:
    input: "path to the candidate input file you wrote (e.g. /tmp/x.bin)"
    target: "the function to break on (a sink from the worklist you are aiming for)"

diversify:
  description: >
    Deterministic Furthest-Point-First target picker. Give it the functions
    where you have already found distinct crashes (comma-separated) and it
    returns the reachable sinks that are FURTHEST from them in the call
    structure -- the targets most likely to be a genuinely different fault, so
    your next crash lands somewhere new. Call it after each crash to choose where
    to go next; with no argument it returns the nearest-first worklist.
  params:
    cracked: "comma-separated function names where you already found crashes"
