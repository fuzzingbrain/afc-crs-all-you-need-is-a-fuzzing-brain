# Tool descriptions — model-facing text, separated from the tool code.
#
# A tool's description is prompt: the model decides how and when to call a tool
# from what this says. Keeping it here rather than inline in tools.py means every
# word the model reads about the tools lives in prompts/, with the rest.
#
# Each entry is one tool. `description` is the tool's own text; `params` gives a
# per-argument line where one helps the model.

read:
  description: >
    Read a file (or a slice), returned with line numbers. Paths are relative to
    the challenge directory.
  params:
    offset: "first line, 1-based"
    limit: "how many lines"

glob:
  description: "List files matching a glob pattern, e.g. '**/*.c' or 'src/*.h'."

grep:
  description: >
    Search file contents for a pattern (ripgrep). Optionally restrict to a glob.

bash:
  description: >
    Run a shell command in the challenge directory. Use it to write a candidate
    input (e.g. with python3) and to test it with ./submit <file>. No network.

gates:
  description: >
    Deterministic constraint precompute. Given a function name, returns the
    literal input gates on the static call-path from the harness entry to it --
    magic byte sequences (memcmp/strncmp against a constant), minimum/maximum
    length checks, and byte-equality tests -- that an input must satisfy to
    reach it. Call this before you build a seed for a target: it tells you the
    concrete bytes and lengths the path requires, so you are not guessing which
    bytes matter. Computed from the source, not a model's opinion.
  params:
    func: "the target function name"

trace:
  description: >
    Run an input file you wrote through the real graded binary under a debugger
    and report, from that run, WHERE it went and WHY it stopped: the dynamic
    call sequence through the project's functions, the deepest call, and the
    stop point with the live values on the stack -- an error message and who
    raised it, a longjmp or exception, an abort, or the sanitizer fault. Works
    on a clean run as well as a crash, so use it whenever ./submit says clean
    and you want to know how far the input got and what rejected it. By default
    the report is brief (about ten lines): the outcome, why it stopped, the
    deepest call, and for each target named whether it was reached and what it
    returned. Ask for verbose when you need the live arguments at the stop, the
    full list of functions reached, or the call sequence. Leak detection is off
    under the debugger, so confirm memory-leak faults through ./submit.
  params:
    input: "path to the candidate input file you wrote (e.g. /tmp/x.bin)"
    target: "optional: function(s) to report reached / returned status for, comma-separated (e.g. the sink you are aiming for and the parser on the way to it)"
    verbose: "optional, default false: true adds the live arguments at the stop, every function reached with call counts, and the full call sequence"

note:
  description: >
    Pin a fact you have established so it survives context compaction. Your
    older tool outputs are removed from your context as the run grows; the
    facts you pin here are shown back to you, verbatim, after every
    compaction. Pin what you would hate to re-derive: the input format the
    harness demands, a check you confirmed must be passed (with file:line), a
    hypothesis you ruled out and why, which candidate reached how far. One
    fact per call; the same key overwrites. Keep it to one or two lines.
  params:
    key: "short identifier for the fact, e.g. 'format', 'gate:png_read_info', 'ruled-out:chunk-len'"
    value: "the fact itself, one or two lines, with file:line where it came from"

recall:
  description: >
    Bring back an evicted tool result verbatim. When compaction removes an old
    result from your context it leaves a stub like "[elided: #12 · bash · 8210
    chars ...; recall(12) restores it]"; call recall with that number to see
    the full output again. Results of pure reads (read, glob, grep, gates) are
    not stored -- call the tool again instead.
  params:
    ref: "the number in the stub, e.g. 12"

diversify:
  description: >
    Deterministic Furthest-Point-First target picker. Give it the functions
    where you have already found distinct crashes (comma-separated) and it
    returns the reachable sinks that are FURTHEST from them in the call
    structure -- the targets most likely to be a genuinely different fault, so
    your next crash lands somewhere new. Call it after each crash to choose where
    to go next.
  params:
    cracked: "comma-separated function names where you already found crashes"
