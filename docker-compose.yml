services:
  fb-postgres:
    image: postgres:18
    container_name: fb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fuzzingbrain
      POSTGRES_PASSWORD: fuzzingbrain
      POSTGRES_DB: fuzzingbrain
    volumes:
      - fb-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fuzzingbrain", "-d", "fuzzingbrain"]
      interval: 5s
      timeout: 5s
      retries: 5

  fb-redis:
    image: redis:7-alpine
    container_name: fb-redis
    restart: unless-stopped
    volumes:
      - fb-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  fb-task:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${FUZZINGBRAIN_HOST_WORKSPACE:-${PWD}/workspace}:${FUZZINGBRAIN_HOST_WORKSPACE:-${PWD}/workspace}
      - ${PWD}:${PWD}:ro
      - ${PWD}/logs:/app/logs
    environment:
      POSTGRES_URL: "postgresql+psycopg://fuzzingbrain:fuzzingbrain@fb-postgres:5432/fuzzingbrain"
      REDIS_URL: "redis://fb-redis:6379/0"
      RUNNING_IN_DOCKER: "true"
      FUZZINGBRAIN_WORKSPACE_BASE: "${FUZZINGBRAIN_HOST_WORKSPACE:-${PWD}/workspace}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
    depends_on:
      fb-postgres:
        condition: service_healthy
      fb-redis:
        condition: service_healthy
    profiles:
      - task

volumes:
  fb-postgres-data:
  fb-redis-data:
