# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# uv resolves the interpreter from .python-version, the same file the local
# bootstrap reads, so CI runs the version contributors actually run rather than
# whatever the runner image ships.
jobs:
  lint:
    name: Ruff Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install
      - run: uvx ruff check .
      - run: uvx ruff format --check .

  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install
      - run: uv run python -m compileall -q fuzzingbrain/ tests/

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lint, syntax-check]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt
      - run: uv python install
      - run: uv venv
      - run: uv pip install -r requirements.txt pytest mongomock
      - run: uv run pytest tests/ -v
